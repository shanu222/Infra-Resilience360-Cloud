# NET360 Preparation Platform — Nginx TLS reverse proxy template (Ubuntu 22.04+ style).
#
# Prerequisites:
#   - certbot or ACM-imported certs at the paths shown below.
#   - Node / PM2 listening on 127.0.0.1:10000 (see deploy/ecosystem.config.cjs).
#
# Commands:
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# CORS / preflight (critical):
# - Serve the SPA from `www` OR `apex` consistently. The browser Origin will be that host.
# - Put the Node API on `infra-resilience360-cloud-production.up.railway.app` (this file). Do NOT make the browser call `/api` on `www`
#   if that vhost only redirects to another host — OPTIONS preflight cannot follow redirects.
# - For `location /api/` on a *marketing* vhost that shares the same box, either `proxy_pass` to Node
#   with NO redirect on OPTIONS, or point the SPA at `VITE_SITE_URL=https://infra-resilience360-cloud-production.up.railway.app`.
# - Do NOT add nginx `add_header Access-Control-Allow-Origin *` — Node sets credentialed per-origin CORS.
#   Wildcard ACAO on OPTIONS while POST responses omit CORS causes browser blocks on cross-origin API calls.

upstream net360_upstream {
    keepalive 32;
    server 127.0.0.1:10000;
}

limit_req_zone $binary_remote_addr zone=net360_api_zone:10m rate=30r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name infra-resilience360-cloud-production.up.railway.app;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name infra-resilience360-cloud-production.up.railway.app;

    ssl_certificate     /etc/letsencrypt/live/infra-resilience360-cloud-production.up.railway.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/infra-resilience360-cloud-production.up.railway.app/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:MozSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    proxy_set_header Host $host;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript application/xml image/svg+xml text/css text/plain;
    gzip_vary on;

    client_max_body_size 320m;

    location /socket.io/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_pass http://net360_upstream;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;

        proxy_buffering off;
        limit_req zone=net360_api_zone burst=80 nodelay;

        proxy_pass http://net360_upstream;
    }
}

