<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>e-Material and Equipment Hubs</title>


  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>


  <link rel="stylesheet" href="style.css" />
</head>
<body>


  <!-- HEADER -->
  <header class="main-header">
    <div class="header-left">
      <img src="images/ndma-logo.png" alt="NDMA" class="logo">
    </div>
    <h1 class="header-title">e-Material and Equipment Hubs</h1>
  </header>


  <!-- LEFT SIDEBAR PANEL -->
  <aside class="left-panel">
    <div class="left-panel-inner">


      <!-- Search Bar -->
      <input type="text" id="districtSearch" class="search-box" placeholder="Search district...">


      <!-- ⭐ NEW: Auto-suggest dropdown (no layout changes) -->
      <ul id="searchSuggestions" class="suggestions-box"></ul>


      <!-- Results Section -->
      <div class="hub-distance-list" id="hubDistanceList">
        <!-- Filled dynamically by script.js -->
      </div>


    </div>
  </aside>


  <!-- 2x2 GRID -->
  <main class="grid-root">


    <!-- Top-left: MAP (no title) -->
    <section class="box map-box">
      <div class="map-wrap">
        <img src="images/pakistan-map.png" alt="Pakistan map" class="map-image">
        <button class="hub-dot" data-hub="gilgit" style="top:17%; left:60%;">📍Gilgit Hub</button>
        <button class="hub-dot" data-hub="muzaffargarh" style="top:40%; left:58%;">📍Muzaffargarh Hub</button>
        <button class="hub-dot" data-hub="sukkur" style="top:57%; left:44%;">📍Sukkur Hub </button>
      </div>
    </section>


    <!-- Top-right: HUB IMAGES (auto carousel; no title) -->
    <section class="box hubs-box">
      <div id="hubCarousel" class="hub-carousel">
        <!-- images injected by script.js -->
      </div>
    </section>


    <!-- Bottom-left: MATERIALS AVAILABLE -->
    <section class="box materials-box">
      <div class="materials-heading">Materials Available</div>


      <div id="materialShowcase" class="material-showcase">
        <img id="showImg" src="" alt="material" />
        <div class="show-info">
          <h3 id="showTitle"></h3>
          <p id="showDesc"></p>
          <div id="showCounts" class="show-counts"></div>
        </div>
      </div>


      <div id="materialsGrid" class="materials-grid"></div>
    </section>


    <!-- Bottom-right: INVENTORY DETAILS (chart) -->
    <section class="box chart-box">
      <div class="chart-heading">Inventory Details</div>
      <canvas id="inventoryChart"></canvas>
    </section>


  </main>


  <script src="script.js" defer></script>
</body>
</html>
